# 槽点分类体系
#
# 规则粗筛阶段的匹配表。后续可由 AI 依据实际评论扩充关键词，不必改动代码结构。
#
# 字段说明：
#   id        类别标识，会出现在输出 JSON 中，定了别改
#   name      展示名
#   weight    类别权重，用于计算槽点排行（1.0 为基准）
#   keywords  命中即打标。支持纯词匹配，不区分大小写
#   negatives 反义/中性化词，命中则抑制该条命中（如「不卡」不应判为性能问题）

categories:
  - id: balance
    name: 数值与平衡
    weight: 1.0
    keywords:
      - 数值膨胀
      - 强度崩坏
      - 平衡性
      - 削
      - 加强
      - 太强
      - 太弱
      - 废物
      - 退环境
      - 伤害倍率
      - 机制
      - 毒点
    negatives:
      - 平衡得很好
      - 平衡性还行
      - 不膨胀

  - id: monetization
    name: 氪金与卡池
    weight: 1.2
    keywords:
      - 氪金
      - 抽卡
      - 卡池
      - 保底
      - 歪了
      - 沉没成本
      - 逼氪
      - 诱导消费
      - 定价
      - 648
      - 首充
      - 双倍
      - 战令
      - 月卡
    negatives:
      - 白嫖
      - 零氪

  - id: bug_perf
    name: BUG 与性能
    weight: 1.1
    keywords:
      - bug
      - 闪退
      - 崩溃
      - 掉帧
      - 卡顿
      - 发热
      - 优化
      - 加载慢
      - 掉线
      - 修复
      - 补偿
      - 服务器
      - 报错
      - 黑屏
    negatives:
      - 不卡
      - 很流畅
      - 优化不错

  - id: story_character
    name: 剧情与角色
    weight: 0.9
    keywords:
      - 剧情
      - 主线
      - 编剧
      - 人设
      - 立绘
      - 建模
      - 配音
      - 中配
      - 日配
      - 演出
      - 割裂
      - 崩人设
      - 主角
    negatives:
      - 剧情不错
      - 剧情很好

  - id: operation
    name: 运营与活动
    weight: 1.1
    keywords:
      - 运营
      - 策划
      - 活动
      - 福利
      - 客服
      - 公关
      - 道歉
      - 公告
      - 敷衍
      - 长草
      - 逼肝
      - 体力
      - 回归
      - 联动
    negatives: []

  - id: environment
    name: 外挂与环境
    weight: 1.0
    keywords:
      - 外挂
      - 挂狗
      - 脚本
      - 工作室
      - 代练
      - 卖号
      - 搬砖
      - 开黑环境
      - 匹配
      - 举报
      - 封号
      - 演员
    negatives: []

# 情绪判定用的补充词典（在通用情感词典之外叠加）
sentiment_lexicon:
  positive:
    - 牛批
    - 真香
    - 封神
    - 良心
    - 好评
    - 顶
    - 冲
    - 无敌
    - 好玩
    - 满意
    - 感动
  negative:
    - 拉胯
    - 寄
    - 答辩
    - 辣鸡
    - 摆烂
    - 劝退
    - 无语
    - 血压
    - 破防
    - 退坑
    - 恶臭
    - 翻车
    - 崩了
    - 答辩
  # 反讽标记：出现时翻转该条的情绪极性
  sarcasm_markers:
    - 狗头
    - doge
    - 笑死
    - 赢麻了
    - 蒸蒸日上
    - 稳中向好
    - 全靠
